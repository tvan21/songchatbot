<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>🎵 Song-Chatbot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #f0f0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .window {
            width: 550px;
            height: 700px;
            background-color: #f0f0f5;
            display: flex;
            flex-direction: column;
            border: 1px solid #ccc;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        header {
            background-color: #7c3aed;
            color: white;
            padding: 20px 10px 14px 10px;
            text-align: center;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        header p {
            font-size: 11px;
            color: #e9d5ff;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background-color: #fafafa;
            font-size: 10pt;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message {
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .message.user {
            color: #333333;
        }

        .message.bot {
            color: #333333;
        }

        .message .label {
            font-weight: bold;
        }

        .message.user .label {
            color: #333333;
        }

        .message.bot .label {
            color: #7c3aed;
        }

        input {
            font-family: "Segoe UI", sans-serif;
            font-size: 11pt;
            padding: 10px;
            margin: 10px;
            border: 1px solid #ccc;
            outline: none;
            flex-shrink: 0;
        }

        input:focus {
            border-color: #7c3aed;
        }
    </style>
</head>
<body>
    <div class="window">
        <header>
            <h1>🎵 Song-Chatbot</h1>
            <p>Finde deinen perfekten Song</p>
        </header>
        <div id="chat"></div>
        <input id="input" type="text" placeholder="Gib hier deine Nachricht ein..." />
    </div>

    <script>
        const chatDiv = document.getElementById("chat");
        const input = document.getElementById("input");

        function addMessage(sender, text) {
            const div = document.createElement("div");
            div.classList.add("message", sender);

            const label = document.createElement("span");
            label.classList.add("label");
            label.textContent = sender === "user" ? "Du: " : "Bot: ";

            const content = document.createElement("span");
            content.textContent = text;

            div.appendChild(label);
            div.appendChild(content);
            chatDiv.appendChild(div);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        async function sendMessage(message) {
            addMessage("user", message);
            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();
                addMessage("bot", data.response);
            } catch (err) {
                addMessage("bot", "❌ Verbindungsfehler: " + err.message);
            }
        }

        input.addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                const message = input.value.trim();
                if (message) {
                    sendMessage(message);
                    input.value = "";
                }
            }
        });
        addMessage("bot", "Willkommen! 🎵\nBitte gebe jeweils kommasepariert eine Kategorie, Genre, Tempo(slow/medium/fast), Stimmung an.");
    </script>
</body>
</html>
